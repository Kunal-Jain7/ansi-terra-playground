---
- name: Install Grafana
  hosts: main
  become: true
  vars:
    listen_port: 9090
    listen_address: 0.0.0.0

  tasks:
    - name: Download Grafana apt key
      ansible.builtin.apt_key:
        url: https://packages.grafana.com/gpg.key
        state: present
    
    - name: Add Grafana repository to sources.list
      ansible.builtin.apt_repository:
        repo: "deb https://packages.grafana.com/oss/deb stable main"
        state: present
        filename: grafana
    
    - name: Update apt cache and install Grafana
      ansible.builtin.apt:
        name: grafana
        state: present
        update_cache: yes

    - name: Enable and start Grafana service
      ansible.builtin.service:
        name: grafana-server
        state: started
        enabled: true

    - name: Install Prometheus
      ansible.builtin.get_url:
        url: https://github.com/prometheus/prometheus/releases/download/v2.30.3/prometheus-2.30.3.linux-amd64.tar.gz
        dest: /home/ubuntu/
    
    - name: Unzip Prometheus
      ansible.builtin.unarchive:
        src: /home/ubuntu/prometheus-2.30.3.linux-amd64.tar.gz
        dest: /home/ubuntu/
        remote_src: yes

    - name: Create Prometheus Group
      ansible.builtin.group:
        name: prometheus
        state: present

    - name: Create Prometheus User
      ansible.builtin.user:
        name: prometheus
        group: prometheus
        shell: /sbin/nologin

    - name: Create Prometheus directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        recurse: yes
        owner: prometheus
        group: prometheus
        mode: '0755'
      loop:
        - /etc/prometheus
        - /etc/prometheus/rules
        - /etc/prometheus/files_sd
        - /etc/prometheus/rules.d
        - /var/lib/prometheus
    
    - name: Copy Files
      ansible.builtin.file:
        src: " {{ item }}"
        dest: /usr/local/bin/
        remote_src: yes
        owner: prometheus
        group: prometheus
        mode: '0755'
      loop:
        - /home/ubuntu/prometheus-2.30.3.linux-amd64/prometheus
        - /home/ubuntu/prometheus-2.30.3.linux-amd64/promtool
    
    - name: Copy Files
      ansible.builtin.file:
        src: " {{ item }}"
        dest: /etc/prometheus/
        remote_src: yes
      loop:
        - /home/ubuntu/prometheus-2.30.3.linux-amd64/consoles
        - /home/ubuntu/prometheus-2.30.3.linux-amd64/console_libraries

    - name: Create Config File
      ansible.builtin.template:
        src: prometheus.yml.j2
        dest: /etc/prometheus/prometheus.yml

    - name: Create Systemd service file
      ansible.builtin.template:
        src: prometheus.service.j2
        dest: /etc/systemd/system/prometheus.service
    
    - name: Ensure Prometheus service is enabled and started
      ansible.builtin.service:
        name: prometheus
        state: started
        enabled: true

